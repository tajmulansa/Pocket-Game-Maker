name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: game_maker_app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter create --platforms=android .

      - run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/' android/app/build.gradle.kts

      - run: flutter pub get

      - run: |
          sed -i "s/proguard-android.txt/proguard-android-optimize.txt/g" \
          ~/.pub-cache/hosted/pub.dev/flutter_inappwebview_android-*/android/build.gradle || true

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: PocketGameMaker-APK
          path: game_maker_app/build/app/outputs/flutter-apk/app-release.apk