name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: game_maker_app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter create --platforms=android .

      - name: Force SDK 36 for all plugins
        run: |
          cat >> android/build.gradle.kts <<'EOF'

          subprojects {
              afterEvaluate {
                  if (plugins.hasPlugin("com.android.library") || plugins.hasPlugin("com.android.application")) {
                      extensions.findByName("android")?.let { ext ->
                          ext.javaClass.methods.find { it.name == "setCompileSdkVersion" && it.parameterCount == 1 }
                              ?.invoke(ext, 36)
                      }
                  }
              }
          }
          EOF

      - run: flutter pub get

      - run: |
          sed -i "s/proguard-android.txt/proguard-android-optimize.txt/g" \
          ~/.pub-cache/hosted/pub.dev/flutter_inappwebview_android-*/android/build.gradle || true

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: PocketGameMaker-APK
          path: game_maker_app/build/app/outputs/flutter-apk/app-release.apk