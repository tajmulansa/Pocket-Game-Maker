name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project files
        working-directory: game_maker_app
        run: flutter create --platforms=android .

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set compile SDK to 36
        working-directory: game_maker_app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts"),
          ]

          for path in files:
              if path.exists():
                  text = path.read_text()
                  text = text.replace(
                      "compileSdk = flutter.compileSdkVersion",
                      "compileSdk = 36",
                  )
                  text = text.replace(
                      "compileSdk flutter.compileSdkVersion",
                      "compileSdk 36",
                  )
                  path.write_text(text)
          PY

      - name: Get dependencies
        working-directory: game_maker_app
        run: flutter pub get

      - name: Build release APK
        working-directory: game_maker_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketGameMaker-APK
          path: game_maker_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error